services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portside/site:latest
    container_name: portside-web
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
